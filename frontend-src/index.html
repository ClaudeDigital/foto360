<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e7e9e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>foto360 — Një foto në ditë, një timelapse në fund</title>
    <meta name="description" content="Bëj foto çdo ditë në një lokacion dhe krijo video timelapse automatikisht." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS: run full-screen when added to the Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="foto360" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="foto360" />
    <meta property="og:description" content="Dokumento çdo ditë. Shiko progresin në video timelapse." />
    <meta property="og:image" content="/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      // Apply theme before first paint to avoid a white flash in dark mode.
      try {
        var t = localStorage.getItem('foto360_theme');
        var d = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (d) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
